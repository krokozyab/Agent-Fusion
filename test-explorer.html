<!DOCTYPE html>
<html>
<head>
    <title>Test Explorer Functions</title>
    <script>
        function toggleFilters(){const p=document.getElementById('filter-panel');if(p)p.style.display=p.style.display==='none'?'block':'none'}
        function updateTokensDisplay(v){const d=document.getElementById('max-tokens-value');if(d){const n=parseInt(v);d.textContent=n>=1000?(n/1000)+'K':n}}
        function resetFilters(){document.getElementById('filter-paths').value='';document.getElementById('filter-exclude').value='';document.querySelectorAll('input[name="languages"]').forEach(e=>e.checked=['kotlin','java'].includes(e.value));document.querySelectorAll('input[name="kinds"]').forEach(e=>e.checked=e.value.startsWith('CODE_'));document.getElementById('filter-max-results').value='20';document.getElementById('max-results-value').textContent='20';document.getElementById('filter-max-tokens').value='6000';updateTokensDisplay('6000');localStorage.removeItem('explorer-filters')}
        function saveFilters(){const f={paths:document.getElementById('filter-paths')?.value||'',excludePatterns:document.getElementById('filter-exclude')?.value||'',languages:Array.from(document.querySelectorAll('input[name="languages"]:checked')).map(e=>e.value),kinds:Array.from(document.querySelectorAll('input[name="kinds"]:checked')).map(e=>e.value),maxResults:document.getElementById('filter-max-results')?.value||'20',maxTokens:document.getElementById('filter-max-tokens')?.value||'6000'};localStorage.setItem('explorer-filters',JSON.stringify(f));const b=event.target,t=b.textContent;b.textContent='✓ Saved';b.classList.add('btn-success');b.classList.remove('btn-outline-primary');setTimeout(()=>{b.textContent=t;b.classList.remove('btn-success');b.classList.add('btn-outline-primary')},2000)}
        function copyToClipboard(b){const c=b.getAttribute('data-content');if(c)navigator.clipboard.writeText(c).then(()=>{const t=b.textContent;b.textContent='✓ Copied';setTimeout(()=>b.textContent=t,2000)}).catch(e=>console.error('Failed:',e))}
    </script>
</head>
<body>
    <button onclick="toggleFilters()">Toggle Filters</button>
    <div id="filter-panel" style="display:none;">Filter Panel Content</div>
    <p>If clicking the button shows/hides the panel, the script works!</p>
</body>
</html>
